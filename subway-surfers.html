<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Subway Surfers - AfterClass</title>
        <meta name="description" content="Play Subway Surfers on AfterClass.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>AfterClass</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <h1>Subway Surfers</h1>
            <iframe id="subway-surfers-game" src="https://www.madkidgames.com/full/subway-surfers" width="100%" height="540" frameborder="0" allowfullscreen scrolling="no" loading="lazy" title="Subway Surfers"></iframe>
            <button id="fullscreen-button" type="button">Enter fullscreen</button>
            <p id="fullscreen-status" role="status" aria-live="polite"></p>
        </main>
        <footer>
            <nav aria-label="Footer">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
            <p>&copy; 2026 AfterClass. All rights reserved. Made with hate for GoGuardian in Californa</p>
        </footer>
        <script>
            const game = document.getElementById("subway-surfers-game");
            const fullscreenButton = document.getElementById("fullscreen-button");
            const fullscreenStatus = document.getElementById("fullscreen-status");

            fullscreenButton.addEventListener("click", async () => {
                fullscreenStatus.textContent = "";

                try {
                    if (document.fullscreenElement === game) {
                        await document.exitFullscreen();
                    } else {
                        await game.requestFullscreen();
                    }
                } catch (error) {
                    fullscreenStatus.textContent = "Fullscreen is not available in this browser.";
                }
            });

            document.addEventListener("fullscreenchange", () => {
                fullscreenButton.textContent =
                    document.fullscreenElement === game ? "Exit fullscreen" : "Enter fullscreen";
            });
        </script>
        <script src="script.js"></script>
    </body>
</html>
